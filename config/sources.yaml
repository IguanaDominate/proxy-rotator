output_dir: proxy_output
sources:
  - name: free-proxy-list
    url: https://free-proxy-list.net/
    protocol: http
    enabled: true
  - name: proxy-list-download
    url: https://www.proxy-list.download/api/v1/get?type=http
    protocol: http
    enabled: true
  - name: openproxy-list
    url: https://openproxy.space/list/http
    protocol: http
    enabled: true
  - name: socks-proxy
    url: https://www.proxy-list.download/api/v1/get?type=socks5
    protocol: socks5
    enabled: true
validation:
  concurrency: 50
  timeout: 8.0
  check_url: https://httpbin.org/ip